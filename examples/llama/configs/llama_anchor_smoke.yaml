runtime:
  image: megatron-lm:smoke
  container_name: mcore-llama-anchor-smoke
  output_dir: local/llama-anchor-smoke
  foreground: true

distributed:
  nproc_per_node: 1
  min_cuda_devices: 1

model:
  num_layers: 4
  hidden_size: 256
  ffn_hidden_size: 896
  num_attention_heads: 8
  num_query_groups: 4
  kv_channels: 32
  seq_length: 256
  max_position_embeddings: 256

training:
  micro_batch_size: 1
  global_batch_size: 1
  train_iters: 2
  lr_decay_iters: 2
  exit_duration_in_mins: 130

optimizer:
  lr: "1.5e-4"
  min_lr: "1.0e-5"
  lr_decay_style: cosine
  weight_decay: "0.1"
  clip_grad: "1.0"

parallelism:
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1

data:
  mode: mock
  vocab_size: 8192
  split: 949,50,1

logging:
  log_interval: 100
  eval_interval: 10000
  eval_iters: 5
  save_interval: 1000000000
