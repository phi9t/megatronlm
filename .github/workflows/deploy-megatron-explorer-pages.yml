name: Deploy Megatron Explorer Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/megatron-explorer
    paths:
      - explorer/**
      - .github/workflows/deploy-megatron-explorer-pages.yml

permissions:
  contents: write

concurrency:
  group: megatron-explorer-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.repository == 'phi9t/megatronlm'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: explorer/package-lock.json

      - name: Build Megatron Explorer
        working-directory: explorer
        env:
          MEGATRON_EXPLORER_REPO_HOME: https://github.com/phi9t/megatronlm
          MEGATRON_EXPLORER_SOURCE_REF: ${{ github.sha }}
          VITE_BASE_PATH: /megatronlm/explorer/
          VITE_REPO_HOME: https://github.com/phi9t/megatronlm
          VITE_SOURCE_REF: ${{ github.sha }}
        run: |
          npm install
          ./scripts/workflow.sh gen-data
          npm run build

      - name: Publish explorer directory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          rm -rf local/pages-publish
          mkdir -p local/pages-publish
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" local/pages-publish || true

          if [ ! -d local/pages-publish/.git ]; then
            git -C local/pages-publish init
            git -C local/pages-publish checkout -B gh-pages
          fi

          rm -rf local/pages-publish/explorer
          mkdir -p local/pages-publish/explorer
          cp -R explorer/dist/. local/pages-publish/explorer/
          touch local/pages-publish/.nojekyll

          git -C local/pages-publish config user.name "github-actions[bot]"
          git -C local/pages-publish config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C local/pages-publish add .
          git -C local/pages-publish commit -m "Deploy megatron explorer" || exit 0
          git -C local/pages-publish remote remove origin 2>/dev/null || true
          git -C local/pages-publish remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C local/pages-publish push origin gh-pages
