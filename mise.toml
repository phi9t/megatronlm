[tasks.anchor-train]
description = "Launch the local Megatron-LM anchor training run."
run = "UV_PROJECT_ENVIRONMENT=local/uv-anchor uv run python tools/run_anchor_training.py"

[tasks.anchor-train-smoke]
description = "Run a short foreground smoke check for the anchor training launcher."
run = "UV_PROJECT_ENVIRONMENT=local/uv-anchor uv run python tools/run_anchor_training.py --name mcore-anchor-smoke --output-dir local/anchor-training-smoke --train-iters 2 --foreground"

[tasks.anchor-train-preflight]
description = "Run environment probes plus a 2-iteration foreground anchor training preflight."
run = "UV_PROJECT_ENVIRONMENT=local/uv-anchor uv run python tools/run_anchor_training.py --preflight --name mcore-anchor-preflight --output-dir local/anchor-training-preflight --duration-mins 5 --train-iters 2 --foreground"

[tasks.llama-anchor]
description = "Launch the YAML-configured local Megatron-LM Llama anchor run."
run = "UV_PROJECT_ENVIRONMENT=local/uv-anchor uv run python examples/llama/run_llama.py --config examples/llama/configs/llama_anchor.yaml"

[tasks.llama-anchor-smoke]
description = "Run a short YAML-configured foreground Llama anchor smoke check."
run = "UV_PROJECT_ENVIRONMENT=local/uv-anchor uv run python examples/llama/run_llama.py --config examples/llama/configs/llama_anchor_smoke.yaml"

[tasks.llama-anchor-preflight]
description = "Run environment probes plus a 2-iteration YAML-configured Llama anchor preflight."
run = "UV_PROJECT_ENVIRONMENT=local/uv-anchor uv run python examples/llama/run_llama.py --config examples/llama/configs/llama_anchor_preflight.yaml"

[tasks.llama3-8b-long]
description = "Launch the long YAML-configured local Llama-3 8B FP8 mock-data run."
run = "UV_PROJECT_ENVIRONMENT=local/uv-anchor uv run python examples/llama/run_llama.py --config examples/llama/configs/llama3_8b_long.yaml"

[tasks.llama3-8b-long-preflight]
description = "Run YAML-configured Llama-3 8B FP8 environment probes in the foreground."
run = "UV_PROJECT_ENVIRONMENT=local/uv-anchor uv run python examples/llama/run_llama.py --config examples/llama/configs/llama3_8b_preflight.yaml"

[tasks.llama3-8b-long-dry-run]
description = "Print the long YAML-configured Llama-3 8B FP8 Docker command."
run = "UV_PROJECT_ENVIRONMENT=local/uv-anchor uv run python examples/llama/run_llama.py --config examples/llama/configs/llama3_8b_long.yaml --dry-run"

[tasks.verl-megatron-setup]
description = "Initialize the vendored verl + Megatron-Bridge workflow, patch Bridge, build the image, and prepare SFT data."
run = "UV_PROJECT_ENVIRONMENT=local/uv-anchor uv run python tools/verl_megatron.py setup"

[tasks.verl-megatron-preflight]
description = "Run a quick import/GPU preflight for the vendored verl + Megatron-Bridge workflow."
run = "UV_PROJECT_ENVIRONMENT=local/uv-anchor uv run python tools/verl_megatron.py preflight"

[tasks.verl-megatron-smoke]
description = "Run the one-step 8-GPU verl Megatron-FSDP SFT smoke."
run = "UV_PROJECT_ENVIRONMENT=local/uv-anchor uv run python tools/verl_megatron.py preflight --smoke"

[tasks.verl-megatron-dry-run]
description = "Print the vendored verl + Megatron-Bridge setup and preflight commands without running them."
run = "UV_PROJECT_ENVIRONMENT=local/uv-anchor uv run python tools/verl_megatron.py setup --dry-run && UV_PROJECT_ENVIRONMENT=local/uv-anchor uv run python tools/verl_megatron.py preflight --dry-run"
